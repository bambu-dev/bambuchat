version: '3'

services:
  base:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        BUNDLE_WITHOUT: 'development test'
        EXECJS_RUNTIME: Node
        RAILS_ENV: production
        RAILS_SERVE_STATIC_FILES: 'true'
    image: 'chatwoot-base:production'
    env_file: .env

  rails:
    build:
      context: .
      dockerfile: ./docker/dockerfiles/rails.Dockerfile
    image: 'chatwoot-rails:production'
    env_file: .env
    volumes:
      - 'node_modules:/app/node_modules'
      - 'packs:/app/public/packs'
      - 'cache:/app/tmp/cache'
      - 'bundle:/usr/local/bundle'
    depends_on:
      - postgres
      - redis
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    entrypoint: docker/entrypoints/rails.sh
    command:
      - bundle
      - exec
      - rails
      - s
      - '-p'
      - '3000'
      - '-b'
      - 0.0.0.0

  sidekiq:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        BUNDLE_WITHOUT: 'development test'
        EXECJS_RUNTIME: Node
        RAILS_ENV: production
        RAILS_SERVE_STATIC_FILES: 'true'
    image: 'chatwoot-sidekiq:production'
    env_file: .env
    volumes:
      - 'node_modules:/app/node_modules'
      - 'packs:/app/public/packs'
      - 'cache:/app/tmp/cache'
      - 'bundle:/usr/local/bundle'
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command:
      - bundle
      - exec
      - sidekiq
      - '-C'
      - config/sidekiq.yml

  postgres:
    image: 'pgvector/pgvector:pg16'
    restart: always
    volumes:
      - 'postgres:/data/postgres'
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  redis:
    image: 'redis:alpine'
    restart: always
    command:
      - sh
      - '-c'
      - 'redis-server --requirepass "$REDIS_PASSWORD"'
    volumes:
      - 'redis:/data/redis'

  media-server:
    image: 'chatwoot-media-server:production'
    build:
      context: ./enterprise/media-server
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
      - '10000-10100:10000-10100/udp'
    environment:
      - 'AUTH_TOKEN=${MEDIA_SERVER_AUTH_TOKEN:-}'
      - 'RAILS_CALLBACK_URL=http://rails:3000'
      - RECORDINGS_DIR=/recordings
      - LOG_LEVEL=info
      - UDP_PORT_MIN=10000
      - UDP_PORT_MAX=10100
      - 'PUBLIC_IP=${MEDIA_SERVER_PUBLIC_IP:-}'
      - 'STUN_SERVERS=stun:stun.l.google.com:19302'
    volumes:
      - 'media_recordings:/recordings'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:4000/health']
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres:
  redis:
  packs:
  node_modules:
  cache:
  bundle:
  media_recordings:
